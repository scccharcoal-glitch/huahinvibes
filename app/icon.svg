<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b50062"/>
      <stop offset="100%" stop-color="#7f45a1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#grad)"/>
  <!-- Letter H -->
  <line x1="9"  y1="8.5" x2="9"  y2="23.5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="23" y1="8.5" x2="23" y2="23.5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="9"  y1="16"  x2="23" y2="16"   stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Small wave dot below H for "vibes" feel -->
  <circle cx="16" cy="26.5" r="1.5" fill="white" opacity="0.6"/>
</svg>
